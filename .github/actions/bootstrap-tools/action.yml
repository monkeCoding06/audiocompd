name: Bootstrap host tools
description: Provide native host-tool executables without requiring root access

runs:
  using: composite

  steps:
    - name: Check host tools
      id: tools
      shell: bash
      run: |
        missing=false

        for tool in git zip unzip pkg-config; do
          if command -v "$tool" >/dev/null 2>&1; then
            echo "$tool: $(command -v "$tool")"
          else
            echo "$tool is unavailable and will be bootstrapped"
            missing=true
          fi
        done

        echo "missing=$missing" >> "$GITHUB_OUTPUT"

    - name: Install pkgx
      if: steps.tools.outputs.missing == 'true'
      uses: pkgxdev/setup@4d4ae97af87ccb39ab8be4e073dea697fef2c6f7

    - name: Add native pkgx executables to PATH
      if: steps.tools.outputs.missing == 'true'
      shell: bash
      run: |
        set -euo pipefail

        add_tool() {
          local command_name="$1"
          local package_name="$2"

          if command -v "$command_name" >/dev/null 2>&1; then
            return
          fi

          local executable
          executable="$(
            pkgx --quiet "+$package_name" -- \
              /bin/sh -c "command -v '$command_name'"
          )"

          if [[ -z "$executable" || ! -x "$executable" ]]; then
            echo "::error::pkgx did not provide an executable for $command_name"
            exit 1
          fi

          echo "$command_name: $executable"
          dirname "$executable" >> "$GITHUB_PATH"
        }

        add_tool git git-scm.org
        add_tool zip info-zip.org/zip
        add_tool unzip info-zip.org/unzip
        add_tool pkg-config freedesktop.org/pkg-config

    - name: Verify host tools
      shell: bash
      run: |
        set -euo pipefail

        for tool in git zip unzip pkg-config; do
          executable="$(command -v "$tool")"
          echo "$tool: $executable"

          if [[ ! -x "$executable" ]]; then
            echo "::error::$tool is not an executable file"
            exit 1
          fi
        done

        git --version
        pkg-config --version
