name: Bootstrap host tools
description: Provide native host build tools without requiring root access

runs:
  using: composite

  steps:
    - name: Check host tools
      id: tools
      shell: bash
      run: |
        missing=false

        required_tools=(
          git
          zip
          unzip
          pkg-config
          autoconf
          autoheader
          aclocal
          automake
          libtoolize
        )

        for tool in "${required_tools[@]}"; do
          if command -v "$tool" >/dev/null 2>&1; then
            echo "$tool: $(command -v "$tool")"
          else
            echo "$tool is unavailable and will be bootstrapped"
            missing=true
          fi
        done

        echo "missing=$missing" >> "$GITHUB_OUTPUT"

    - name: Install pkgx
      if: steps.tools.outputs.missing == 'true'
      uses: pkgxdev/setup@4d4ae97af87ccb39ab8be4e073dea697fef2c6f7

    - name: Add pkgx host tools to PATH
      if: steps.tools.outputs.missing == 'true'
      shell: bash
      run: |
        set -euo pipefail

        add_tool() {
          local command_name="$1"
          local package_name="$2"

          if command -v "$command_name" >/dev/null 2>&1; then
            return
          fi

          local executable
          executable="$(
            pkgx --quiet "+$package_name" -- \
              /bin/sh -c "command -v '$command_name'"
          )"

          if [[ -z "$executable" || ! -x "$executable" ]]; then
            echo "::error::pkgx did not provide $command_name"
            exit 1
          fi

          echo "$command_name: $executable"
          dirname "$executable" >> "$GITHUB_PATH"
        }

        add_tool git git-scm.org
        add_tool zip info-zip.org/zip
        add_tool unzip info-zip.org/unzip
        add_tool pkg-config freedesktop.org/pkg-config

        add_tool autoconf gnu.org/autoconf
        add_tool autoheader gnu.org/autoconf
        add_tool automake gnu.org/automake
        add_tool aclocal gnu.org/automake
        add_tool libtoolize gnu.org/libtool

    - name: Configure Autotools environment
      if: steps.tools.outputs.missing == 'true'
      shell: bash
      run: |
        set -euo pipefail

        autotools_path="$(
          pkgx --quiet \
            +gnu.org/autoconf \
            +gnu.org/autoconf-archive \
            +gnu.org/automake \
            +gnu.org/libtool \
            -- /bin/sh -c 'printf %s "$PATH"'
        )"

        aclocal_path="$(
          pkgx --quiet \
            +gnu.org/autoconf \
            +gnu.org/autoconf-archive \
            +gnu.org/automake \
            +gnu.org/libtool \
            -- /bin/sh -c 'printf %s "${ACLOCAL_PATH-}"'
        )"

        if [[ -z "$autotools_path" ]]; then
          echo "::error::pkgx did not provide an Autotools PATH"
          exit 1
        fi

        while IFS= read -r directory; do
          if [[ -n "$directory" && -d "$directory" ]]; then
            echo "$directory" >> "$GITHUB_PATH"
          fi
        done < <(
          printf '%s' "$autotools_path" \
            | tr ':' '\n'
        )

        if [[ -n "$aclocal_path" ]]; then
          echo "ACLOCAL_PATH=$aclocal_path" >> "$GITHUB_ENV"
        fi

    - name: Verify host tools
      shell: bash
      run: |
        set -euo pipefail

        required_tools=(
          git
          zip
          unzip
          pkg-config
          autoconf
          autoheader
          aclocal
          automake
          libtoolize
        )

        for tool in "${required_tools[@]}"; do
          executable="$(command -v "$tool")"
          echo "$tool: $executable"

          if [[ ! -x "$executable" ]]; then
            echo "::error::$tool is not an executable file"
            exit 1
          fi
        done

        git --version
        pkg-config --version
        autoconf --version | head -n 1
        automake --version | head -n 1
        libtoolize --version | head -n 1
